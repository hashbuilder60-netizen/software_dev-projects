name: Idempotent Job Orchestrator CI

on:
  push:
    branches: [ main ]
    paths:
      - 'idempotent-job-orchestrator/**'
      - '.github/workflows/idempotent-job-orchestrator-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'idempotent-job-orchestrator/**'
      - '.github/workflows/idempotent-job-orchestrator-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idempotent-job-orchestrator
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest -q

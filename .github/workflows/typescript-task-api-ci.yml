name: TypeScript Task API CI

on:
  push:
    branches: [ main ]
    paths:
      - 'typescript-task-api/**'
      - '.github/workflows/typescript-task-api-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript-task-api/**'
      - '.github/workflows/typescript-task-api-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-task-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

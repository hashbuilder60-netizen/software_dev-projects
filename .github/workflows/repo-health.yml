name: Repo Health

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repo structure
        run: python tools/repo_health.py

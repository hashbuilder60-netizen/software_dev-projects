[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-algorithms-toolkit"
version = "0.1.0"
description = "Core algorithm implementations in Python."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
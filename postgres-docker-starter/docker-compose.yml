version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: pg_starter
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer:latest
    container_name: pg_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pg_data: